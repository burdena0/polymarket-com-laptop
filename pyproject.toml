[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-weather-laptop"
version = "0.1.0"
requires-python = ">=3.10"
description = "Local Polymarket.com weather activity observer and paper execution journal"

[project.optional-dependencies]
accounts = ["py-clob-client-v2==1.1.0"]

[tool.setuptools.packages.find]
include = ["weather_laptop*"]

[tool.setuptools.package-data]
weather_laptop = ["index.html"]
